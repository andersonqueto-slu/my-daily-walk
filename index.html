<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#204f78"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Daily Walk"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="icon" type="image/png" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><title>My Daily Walk</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#233443;background:#f7f6f0}*{box-sizing:border-box}body{margin:0}header{background:#204f78;color:white;padding:18px 20px;display:flex;align-items:center;gap:12px}header img{width:48px;height:48px;border-radius:12px}header h1{font-size:21px;margin:0}header small{opacity:.8}nav{display:flex;overflow:auto;background:white;position:sticky;top:0;border-bottom:1px solid #ddd}nav button{flex:1;border:0;background:white;padding:16px 10px;color:#345;font-weight:700}nav button.active{border-bottom:3px solid #287bb3;color:#145c91}main{max-width:780px;margin:auto;padding:18px 16px 60px}.panel{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0000000c}h2{color:#204f78;margin:0 0 10px}h3{color:#204f78}.muted{color:#667789}.verse{background:#edf4f8;border-left:4px solid #5c98ba;padding:12px;border-radius:6px}button.action{border:0;background:#246b9c;color:white;padding:12px 17px;border-radius:9px;font-weight:650;margin:5px 6px 5px 0}button.action.secondary{background:#e5edf3;color:#1c5078}input,textarea,select{font:inherit;border:1px solid #bdcbd4;border-radius:9px;padding:12px;width:100%;margin:7px 0}textarea{min-height:120px}p{line-height:1.65;white-space:pre-wrap}#loading{padding:20px}.note{font-size:13px;color:#647481}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:160px}.row button{flex-shrink:0}.hidden{display:none}body.dark{background:#15232d;color:#e8eff4}body.dark .panel,body.dark nav,body.dark nav button{background:#20323f;color:#edf4f8}body.dark h2,body.dark h3{color:#a4d6f2}body.dark .verse{background:#2b4455}body.dark input,body.dark textarea,body.dark select{background:#172b38;color:white} body[data-theme="Teal"] header{background:#166c71}body[data-theme="Gold"] header{background:#82601c}body[data-size="Small"] main{font-size:14px}body[data-size="Normal"] main{font-size:16px}body[data-size="Large"] main{font-size:19px}body[data-size="Extra Large"] main{font-size:22px}.settings-panel{border-left:5px solid #c6ddeb}.settings-panel:nth-child(even){border-left-color:#e5d7a9}.settings-panel:nth-child(3n){border-left-color:#bce1d3}.settings-panel label{display:block;margin-top:10px;font-weight:600} .settings-panel select{max-width:400px}</style></head><body><header><img src="icon.png" alt=""><div><h1>My Daily Walk</h1><small>Scripture • Reflection • Growth</small></div></header><nav id="nav"><button data-tab="today" class="active">Today</button><button data-tab="journey">Journey</button><button data-tab="history">History</button><button data-tab="bible">Bible</button><button data-tab="settings">Settings</button></nav><main id="main"><p id="loading">Loading your devotional library…</p></main><script>
let dev=[],lessons=[],bible=[],tab='today',day=1;const main=document.querySelector('#main');const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const para=(s)=>'<p>'+esc(s)+'</p>';const start=()=>get('startDate',new Date().toISOString().slice(0,10));const maxday=()=>Math.max(1,Math.min(dev.length,Math.floor((new Date().setHours(0,0,0,0)-new Date(start()+'T00:00:00').getTime())/86400000)+1));const btn=(label,fn,other=false)=>'<button class="action'+(other?' secondary':'')+'" onclick="'+fn+'">'+label+'</button>';function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let s='';if(tab==='today'){day=Math.min(day,maxday());let d=dev[day-1];if(!d){main.innerHTML='No devotion available';return}let ans=get('reflection_'+day,'');s='<div class="panel"><div class="muted">Day '+day+' of '+dev.length+' • Available through day '+maxday()+'</div><h2>'+esc(d.title)+'</h2><div class="verse">'+esc(d.scripture_reference)+'</div><h3>Devotion</h3>'+para(d.devotion)+'<h3>Heart Question</h3>'+para(d.question)+'<h3>Reflection</h3>'+para(d.reflection_prompt)+'<textarea id="answer" placeholder="Write your personal reflection…">'+esc(ans)+'</textarea>'+btn('Save reflection','saveReflection()')+'<h3>Call to Action</h3>'+para(d.call_to_action)+'<h3>Prayer</h3>'+para(d.prayer)+'</div><div class="row">'+btn('Previous day','changeDay(-1)',true)+btn('Next available day','changeDay(1)',true)+'</div>'}else if(tab==='journey'){let completed=get('lessonDone',{});s='<div class="panel"><h2>90-Day Discipleship Journey</h2><p>Knowing what you believe, learning how to live, and learning how to serve.</p><label>Choose a lesson</label><select id="lessonSelect" onchange="showLesson(+this.value)">'+lessons.map(l=>'<option value="'+l.day_number+'">Day '+l.day_number+' — '+esc(l.title)+'</option>').join('')+'</select><div id="lesson"></div></div>'}else if(tab==='history'){let saved=[];for(let i=1;i<=maxday();i++){let a=get('reflection_'+i,'');if(a)saved.push('<div class="panel"><h3>Day '+i+': '+esc(dev[i-1].title)+'</h3>'+para(a)+btn('Open devotion','openDay('+i+')',true)+'</div>')}s='<h2>Reflection History</h2>'+(saved.join('')||'<div class="panel">Your saved reflections will appear here.</div>')}else if(tab==='bible'){s='<div class="panel"><h2>NKJV Bible</h2><p class="note">Search by word or reference, for example John 3:16. Bible text is included for offline reading.</p><div class="row"><input id="search" placeholder="Word or Bible reference" onkeydown="if(event.key===&#39;Enter&#39;)searchBible()">'+btn('Search','searchBible()')+'</div><div id="results"></div></div>'}else{s=`<h2>Settings</h2>
<div class="panel settings-panel"><h3>My Profile</h3><label>Name</label><input id="profileName" placeholder="Your name" value="${esc(get('profileName',''))}"><label>Church</label><input id="profileChurch" placeholder="Church (optional)" value="${esc(get('profileChurch',''))}">${btn('Save profile','saveProfile()')}<p class="note">Profile information stays on this device.</p></div>
<div class="panel settings-panel"><h3>My Area of Focus</h3><p>Choose an area for additional study. The current web version does not yet contain separate focus journeys.</p><select id="focus" onchange="setSetting('growthFocus',this.value)">${['General Growth','Prayer','Faith','Family','Service','Spiritual Disciplines'].map(x=>`<option ${get('growthFocus','General Growth')===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="panel settings-panel"><h3>Text Size</h3><p>Choose a comfortable reading size.</p><select id="textSize" onchange="setSetting('textSize',this.value);applyPreferences()">${['Small','Normal','Large','Extra Large'].map(x=>`<option ${get('textSize','Normal')===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="panel settings-panel"><h3>Appearance</h3><select onchange="setSetting('appearance',this.value);applyPreferences()">${['System','Light','Dark'].map(x=>`<option ${get('appearance','System')===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="panel settings-panel"><h3>Color Theme</h3><select onchange="setSetting('colorTheme',this.value);applyPreferences()">${['Blue','Teal','Gold'].map(x=>`<option ${get('colorTheme','Blue')===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="panel settings-panel"><h3>Daily Reminder</h3><p>On iPhone, this web version cannot yet send scheduled reminders. Notification delivery requires a separate push service and user permission.</p><label><input type="checkbox" style="width:auto" ${get('reminderPreference',false)?'checked':''} onchange="setSetting('reminderPreference',this.checked)"> Save reminder preference</label><label>Preferred time</label><input type="time" value="${esc(get('reminderTime','08:00'))}" onchange="setSetting('reminderTime',this.value)"><p class="note">This stores your preference only; it does not schedule an alert.</p></div>
<div class="panel settings-panel"><h3>Devotional Start Date</h3><input type="date" id="startDate" value="${esc(start())}">${btn('Save start date','saveStart()')}<p class="note">Changing this date changes which devotion days are unlocked.</p></div>
<div class="panel settings-panel"><h3>Available Updates</h3><p>The web app is updated through GitHub Pages. Reload to check for the newest published files.</p>${btn('Reload app','window.location.reload()')}</div>
<div class="panel settings-panel"><h3>Privacy &amp; Data</h3><p>My Daily Walk will not share your data with any third party. Information like Your reflections, Progress, and Personal responses are stored only on your device.</p><p class="note">Your reflections are stored in this browser. Clearing website data can erase them. This web version does not synchronize Android progress.</p></div>
<div class="panel settings-panel"><h3>About My Daily Walk</h3><p><strong>My Daily Walk</strong><br>Created by Anderson Queto<br>Created: October 2026<br>Version: Web PWA 1.1</p><p>Created to help believers study God's Word, apply biblical truth, grow as disciples of Jesus Christ, and help others follow Him.</p></div>
<div class="panel settings-panel"><h3>Support My Daily Walk</h3><p>There is no obligation to give. Please continue using and sharing My Daily Walk whether or not you are able to donate.</p><a class="action" href="https://www.paypal.com/ncp/payment/WPGV2QTQCE2AJ" target="_blank" rel="noopener noreferrer">Donate through PayPal</a></div>`}main.innerHTML=s;if(tab==='journey')showLesson(1)}function setSetting(k,v){set(k,v)}function saveProfile(){set('profileName',document.querySelector('#profileName').value);set('profileChurch',document.querySelector('#profileChurch').value);alert('Profile saved on this device.')}function applyPreferences(){const a=get('appearance','System');document.body.classList.toggle('dark',a==='Dark'||(a==='System'&&window.matchMedia('(prefers-color-scheme: dark)').matches));document.body.dataset.size=get('textSize','Normal');document.body.dataset.theme=get('colorTheme','Blue')}function saveReflection(){set('reflection_'+day,document.querySelector('#answer').value);alert('Reflection saved on this device.')}function changeDay(n){day=Math.max(1,Math.min(maxday(),day+n));render()}function openDay(n){tab='today';day=n;render()}function showLesson(n){let l=lessons.find(x=>x.day_number===n);if(!l)return;let done=get('lessonDone',{});document.querySelector('#lessonSelect').value=n;document.querySelector('#lesson').innerHTML='<h3>'+esc(l.phase_title)+'</h3><h2>'+esc(l.title)+'</h2><div class="verse">'+esc(l.scripture_reference)+'</div>'+para(l.lesson)+'<h3>What This Means</h3>'+para(l.what_this_means)+'<h3>Heart Question</h3>'+para(l.heart_question)+'<h3>Practical Assignment</h3>'+para(l.practical_assignment)+'<h3>Prayer</h3>'+para(l.prayer)+btn(done[n]?'Completed ✓':'Mark lesson completed','completeLesson('+n+')')}function completeLesson(n){let done=get('lessonDone',{});done[n]=true;set('lessonDone',done);showLesson(n)}function searchBible(){let q=document.querySelector('#search').value.trim();if(!q)return;let m=q.match(/^(.+?)\s+(\d+)(?::(\d+)(?:-(\d+))?)?$/);let results=m?bible.filter(v=>v.book.toLowerCase()===m[1].toLowerCase()&&v.chapter===+m[2]&&(!m[3]||(v.verse>=+m[3]&&v.verse<=+(m[4]||m[3])))):bible.filter(v=>v.text.toLowerCase().includes(q.toLowerCase())).slice(0,100);document.querySelector('#results').innerHTML='<p class="muted">'+results.length+' result(s)'+(!m&&results.length===100?' (first 100)':'')+'</p>'+results.slice(0,150).map(v=>'<div class="verse" style="margin:9px 0"><strong>'+esc(v.reference)+'</strong> '+esc(v.text)+'</div>').join('')}function saveStart(){set('startDate',document.querySelector('#startDate').value);day=1;tab='today';render()}document.querySelector('#nav').addEventListener('click',e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}});Promise.all(['devotions.json','lessons.json','bible.json'].map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x);return r.json()}))).then(d=>{[dev,lessons,bible]=d;applyPreferences();render()}).catch(e=>main.innerHTML='<p>Unable to load the app data. Please reload while online. '+esc(e.message)+'</p>');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
